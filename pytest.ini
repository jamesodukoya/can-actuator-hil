[pytest]
# xunit1 keeps per-test <properties> (requirement tags) in the JUnit XML.
junit_family = xunit1
# The wall-clock soak test runs only on request (-m realtime); a command-line -m overrides this.
addopts = -m "not realtime"
markers =
    requirements(*ids): requirement IDs from docs/requirements.md that this test verifies
    realtime: runs the virtual ECU paced by the wall clock (soak test, not gating)
